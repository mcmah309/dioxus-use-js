[workspace]
resolver = "3"

members = [
    "dioxus-use-js-macro",
    "dioxus-use-js",
    "example"
]

[workspace.dependencies]
# Local crates
dioxus-use-js = { path = "dioxus-use-js" }
dioxus-use-js-macro = { version = "=0.5.0", path = "dioxus-use-js-macro" }

# External crates
base64 = "0.23.1"
blake3 = "1.8.7"
bon = "3.10.2"
debugid = "0.8.0"
dioxus = { git = "https://github.com/mcmah309/dioxus.git", branch = "fix_liveview_filepicker", default-features = false }
indexmap = "2.14.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = "1.0.229"
serde_json = "1.0.151"
sourcemap = "9.3.2"
swc_common = { version = "26.0.0", default-features = false }
swc_ecma_ast = { version = "29.0.2", default-features = false }
swc_ecma_parser = { version = "46.0.0", default-features = false }
swc_ecma_visit = { version = "29.0.0", default-features = false }
syn = { version = "3.0.6", features = ["full"] }
