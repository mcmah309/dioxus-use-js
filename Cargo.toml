[workspace]
resolver = "3"

members = [
    "dioxus-use-js-macro",
    "dioxus-use-js",
    "example"
]

[workspace.dependencies]
# Local crates
dioxus-use-js = { path = "dioxus-use-js" }
dioxus-use-js-macro = { version = "=0.5.0", path = "dioxus-use-js-macro" }

# External crates
base64 = "0.22"
blake3 = "1.8"
bon = "3"
debugid = "0.8.0"
dioxus = { git = "https://github.com/mcmah309/dioxus.git", branch = "fix_liveview_filepicker", default-features = false }
indexmap = "2"
proc-macro2 = "1.0.103"
quote = "1.0.41"
serde = "1"
serde_json = "1"
sourcemap = "9.3.2"
swc_common = { version = "15.0.0", default-features = false }
swc_ecma_ast = { version = "16.0.0", default-features = false }
swc_ecma_parser = { version = "25.0.0", default-features = false }
swc_ecma_visit = { version = "16.0.0", default-features = false }
syn = { version = "2.0.108", features = ["full"] }
